{% extends "clinic/base.html" %}
{% block title %}Kalendar i Termineve{% endblock %}
{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'clinic/css/appointments_calendar.css' %}">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<div class="flex flex-col gap-4">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
    <div>
      <h2 class="text-2xl font-semibold text-gray-800 flex items-center gap-2">
        <span class="text-emerald-600">🗓️</span> Kalendar i Termineve
      </h2>
      <p class="text-sm text-gray-500">Orari i punës: <span class="font-medium text-gray-700">09:00 – 20:00</span></p>
    </div>
    <button id="addNew" class="px-5 py-2 bg-emerald-600 text-white rounded-lg text-sm shadow hover:bg-emerald-700 transition flex items-center justify-center gap-2 w-full md:w-auto">
      <i class="ph ph-plus"></i> Shto Termin
    </button>
  </div>

  <div id="calendar" class="bg-white rounded-xl border border-gray-200 shadow-sm p-3"></div>
</div>

<div id="appointmentModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
  <div class="modal-content bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative animate-fade-in">
    <h3 id="modalTitle" class="text-lg font-semibold text-gray-800 mb-4">Termin i Ri</h3>
    <form id="appointmentForm" class="space-y-4">
      <input type="hidden" id="apptId">

      <div class="relative">
        <label class="text-sm text-gray-600">Pacienti</label>
        <input id="apptPatientInput" type="text" class="border rounded-lg w-full p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500"
               placeholder="Shkruaj emrin ose numrin e pacientit..." autocomplete="off" required>
        <input type="hidden" id="apptPatient">
        <ul id="patientSuggestions" class="absolute z-10 bg-white border rounded-lg mt-1 w-full shadow hidden max-h-48 overflow-y-auto text-sm"></ul>
      </div>

      <div>
        <label class="text-sm text-gray-600">Doktori</label>
        <select id="apptDoctor" class="border rounded-lg w-full p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500" required>
          <option value="Dr. Labi">Dr. Labi</option>
          <option value="Dr. Linda">Dr. Linda</option>
        </select>
      </div>

      <div>
        <label class="text-sm text-gray-600">Shërbimi / Arsyeja</label>
        <input id="apptTitle" type="text" class="border rounded-lg w-full p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500"
               placeholder="p.sh. Kontroll, Ekstraksion..." required>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-gray-600">Fillimi</label>
          <input id="apptStart" type="datetime-local" class="border rounded-lg w-full p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500" required>
        </div>
        <div>
          <label class="text-sm text-gray-600">Mbarimi</label>
          <input id="apptEnd" type="datetime-local" class="border rounded-lg w-full p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500">
        </div>
      </div>

      <div>
        <label class="text-sm text-gray-600">Statusi</label>
        <select id="apptStatus" class="border rounded-lg w-full p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500">
          <option value="scheduled">Planifikuar</option>
          <option value="completed">Përfunduar</option>
          <option value="cancelled">Anuluar</option>
        </select>
      </div>

      <div>
        <label class="text-sm text-gray-600">Shënime</label>
        <textarea id="apptNotes" rows="2" class="border rounded-lg w-full p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500"></textarea>
      </div>

      <div class="flex flex-col sm:flex-row justify-between gap-2 pt-3">
        <button type="button" id="btnDelete"
                class="hidden px-4 py-2 border border-red-300 text-red-600 rounded-lg text-sm hover:bg-red-50 hover:border-red-400 transition">
          <i class="ph ph-trash"></i> Fshij
        </button>
        <div class="flex gap-2 justify-end w-full sm:w-auto">
          <button type="button" id="btnCancel"
                  class="px-3 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50 transition w-full sm:w-auto">
            Anulo
          </button>
          <button type="submit"
                  class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm hover:bg-emerald-700 transition w-full sm:w-auto">
            Ruaj
          </button>
        </div>
      </div>
    </form>
  </div>
</div>


{% endblock %}
