<a href="{% url 'patient_detail' appt.patient_id %}" class="day-row" data-dashboard-row><time class="day-time">{{ appt.start|date:'H:i' }}</time><div class="day-person"><strong>{{ appt.patient.emri_mbiemri }}</strong><small>{% if appt.pk == next_appointment.pk %}<span class="next-visit-label">TERMINI I RADHËS</span> · {% endif %}{{ appt.title }} · {{ appt.doctor }}</small></div><span class="status-chip {% if appt.status == 'cancelled' %}pending{% elif appt.status == 'scheduled' %}neutral{% endif %}">{{ appt.get_status_display }}</span></a>
