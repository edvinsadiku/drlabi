{% extends 'clinic/base.html' %}
{% block title %}Shpenzim i ri{% endblock %}
{% block content %}
<div class="form-width"><header class="page-heading"><div><p class="eyebrow">SHPENZIMET</p><h1>Shpenzim i ri<span class="title-dot">.</span></h1></div></header>
{% if error %}<div class="module-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="module-card module-form">{% csrf_token %}<section class="form-section"><h2>Detajet e shpenzimit</h2><div class="field-grid"><label class="field full">Emërtimi<input name="shpenzimi" value="{{ request.POST.shpenzimi }}" maxlength="191" required></label><label class="field">Data<input type="date" name="muaji" value="{{ request.POST.muaji }}"></label><label class="field">Shuma (€)<input type="number" min="1" max="2147483647" step="1" name="vlera" value="{{ request.POST.vlera }}" required placeholder="0"></label><label class="field full">Përshkrimi<textarea name="pershkrimi" maxlength="191" rows="4" placeholder="Furnizuesi ose detaje të tjera">{{ request.POST.pershkrimi }}</textarea></label></div></section><section class="form-section"><h2>Gjendja e pagesës</h2><div class="choice-row"><label><input type="checkbox" name="paguar" {% if request.POST.paguar %}checked{% endif %}> Shpenzimi është paguar</label></div></section><footer class="form-footer"><a class="btn" href="{% url 'shpenzime_list' %}">Anulo</a><button type="submit" class="btn btn-primary">Ruaj shpenzimin <i class="ph ph-check" aria-hidden="true"></i></button></footer></form></div>
{% endblock %}
