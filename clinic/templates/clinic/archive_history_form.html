{% extends 'clinic/base.html' %}
{% block title %}Ndrysho trajtimin e arkivuar{% endblock %}
{% block content %}<div class="form-width"><header class="page-heading"><div><p class="eyebrow">ARKIVA · {{ patient.emri_mbiemri }}</p><h1>Ndrysho trajtimin</h1></div></header><form method="post" class="module-card module-form">{% csrf_token %}<section class="form-section"><h2>Të dhënat klinike</h2><div class="field-grid"><label class="field">Data<input name="data" value="{{ historia.data|default:'' }}" required></label><label class="field">Doktori<input name="doctor" value="{{ historia.doctor|default:'' }}"></label><label class="field">Dhëmbët (FDI)<input name="dhembi" value="{{ historia.dhembi|default:'' }}"></label><label class="field">Diagnoza<input name="diagnoza" value="{{ historia.diagnoza|default:'' }}" maxlength="191"></label><label class="field full">Trajtimi<textarea name="trajtimi" rows="3">{{ historia.trajtimi|default:'' }}</textarea></label><label class="field full">Punimi protetikor<textarea name="punim_protetikor" rows="2">{{ historia.punim_protetikor|default:'' }}</textarea></label><label class="field">Tekniku<input name="tekniku" value="{{ historia.tekniku|default:'' }}"></label><label class="field">Pasqyra e dhëmbit<input name="pasqyra_e_dhembit" value="{{ historia.pasqyra_e_dhembit|default:'' }}"></label></div></section><section class="form-section"><h2>Financat e arkivës</h2><div class="field-grid"><label class="field">Vlera (€)<input type="number" step="0.01" name="vlera" value="{{ historia.vlera|default_if_none:'' }}"></label><label class="field">Paguar (€)<input type="number" step="0.01" name="paguar" value="{{ historia.paguar|default_if_none:'' }}"></label><label class="field">Mbetur (€)<input type="number" step="0.01" name="borgji" value="{{ historia.borgji|default_if_none:'' }}"></label><label class="field full">Shënime<textarea name="verejtje" rows="2">{{ historia.verejtje|default:'' }}</textarea></label></div></section><footer class="form-footer"><a class="btn" href="{% url 'patient_detail' patient.id %}?tab=arkiva-histori">Anulo</a><button class="btn btn-primary" type="submit">Ruaj ndryshimet</button></footer></form></div>{% endblock %}
