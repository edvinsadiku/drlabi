{% extends 'clinic/base.html' %}
{% block title %}Trajtim ortodontik{% endblock %}
{% block content %}<div class="form-width"><header class="page-heading"><div><p class="eyebrow">{{ patient.emri_mbiemri }} · ORTODONCIA</p><h1>Trajtim i ri</h1></div></header><form method="post" class="module-card module-form">{% csrf_token %}<section class="form-section"><h2>Trajtimi</h2><div class="field-grid"><label class="field">Data<input type="date" name="data"></label><label class="field">Doktori<input name="doctor" maxlength="191"></label><label class="field full">Diagnoza<input name="diagnoza" maxlength="191"></label><label class="field full">Trajtimi<textarea name="trajtimi" rows="4" maxlength="191"></textarea></label></div></section><section class="form-section"><h2>Pagesa</h2><div class="field-grid"><label class="field">Vlera (€)<input type="number" name="vlera" step="0.01" min="0" placeholder="0.00"></label><label class="field">Paguar (€)<input type="number" name="paguar" step="0.01" min="0" placeholder="0.00"></label><label class="field">Mbetur (€)<input type="number" name="borgji" step="0.01" min="0" placeholder="0.00"></label><label class="field full">Shënime<textarea name="verejtje" rows="2" maxlength="191"></textarea></label></div></section><footer class="form-footer"><a class="btn" href="{% url 'orto_patient_detail' patient.id %}">Anulo</a><button class="btn btn-primary" type="submit">Ruaj trajtimin</button></footer></form></div>{% endblock %}
