{% load static %}
<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyrje | Clinic DB</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 via-white to-emerald-50 text-gray-800">

<div class="w-full max-w-md bg-white rounded-2xl shadow-2xl px-8 py-10 mx-4 animate-fadeIn border border-gray-100">
  <div class="text-center mb-8">
    <img src="{% static 'assets/img/logo.svg' %}" alt="Logo" class="h-20 md:h-24 mx-auto mb-4 drop-shadow-sm">
    <h2 class="text-2xl font-semibold text-gray-800">Mirësevini në Dr. Labi</h2>
    <p class="text-sm text-gray-500">Hyni në sistemin tuaj të menaxhimit klinik</p>
  </div>

  <form method="post" class="space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">Email ose përdoruesi</label>
      <input type="text" name="username" required
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">Fjalëkalimi</label>
      <input type="password" name="password" required
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
    </div>

    <div class="flex items-center justify-between text-sm">
      <label class="flex items-center">
        <input type="checkbox" name="remember"
               class="w-4 h-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500">
        <span class="ml-2 text-gray-600">Më mbaj mend</span>
      </label>
    </div>

    <button type="submit"
            class="w-full py-3 text-white bg-[#006D41] rounded-lg hover:bg-emerald-700 transition font-medium shadow-md">
      Kyçu
    </button>
  </form>
</div>

<style>
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}
.animate-fadeIn { animation: fadeIn 0.6s ease-out; }
</style>

</body>
</html>
