{% load static custom_filters %}
<!DOCTYPE html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hyrje · Dr. Labi Dental Clinic</title><link rel="stylesheet" href="{% versioned_static 'clinic/vendor/inter-tight/font.css' %}"><link rel="stylesheet" href="{% static 'clinic/css/workspace.css' %}"><link rel="stylesheet" href="{% static 'clinic/css/login.css' %}"><link rel="stylesheet" href="{% versioned_static 'clinic/css/glass.css' %}">
{% include 'clinic/components/brand_icons.html' %}
</head>
<body class="clinic-app auth-page"><main class="auth-card"><div class="auth-brand"><img src="{% versioned_static 'assets/img/logo.svg' %}" alt="Dr. Labi Dental Clinic"></div><div class="auth-content"><header><p class="eyebrow">LLOGARIA E STAFIT</p><h1>Hyrje në sistem</h1></header>{% if form.errors %}<div class="auth-error" role="alert">Përdoruesi ose fjalëkalimi nuk është i saktë.</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="username">Përdoruesi</label><input id="username" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus><label for="password">Fjalëkalimi</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="password-toggle" class="icon-button" aria-controls="password" aria-pressed="false">Shfaq</button></div><button type="submit" class="btn btn-primary auth-submit">Hyr në sistem <span aria-hidden="true">→</span></button></form></div><footer>Dr. Labi · Dental Clinic</footer></main><script>document.getElementById('password-toggle').addEventListener('click', function(){const input=document.getElementById('password');const show=input.type==='password';input.type=show?'text':'password';this.textContent=show?'Fshih':'Shfaq';this.setAttribute('aria-pressed',String(show));});</script></body></html>
