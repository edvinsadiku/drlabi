{% extends "clinic/base.html" %}

{% block title %}Postimi final{% endblock %}

{% block content %}
<section class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
  <header class="flex flex-col gap-3 border-b border-slate-200 bg-slate-50 px-5 py-4 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-xl font-semibold text-slate-950">Postimet finale</h1>
      <p class="mt-1 text-sm text-slate-500">U gjeneruan formatet e zgjedhura.</p>
    </div>
    <a href="{% url 'social_media' %}" class="inline-flex h-10 items-center justify-center gap-2 rounded-md border border-slate-200 bg-white px-4 text-sm font-medium text-slate-700 hover:bg-slate-50">
      <i class="ph ph-plus"></i>
      Postim tjetër
    </a>
  </header>

  <div class="grid grid-cols-1 gap-5 bg-slate-100 p-5 xl:grid-cols-2">
    {% for post in posts %}
      <article class="rounded-lg border border-slate-200 bg-white p-4">
        <div class="mb-3 flex items-center justify-between gap-3">
          <div>
            <h2 class="font-semibold text-slate-950">{{ post.label }}</h2>
            <p class="text-xs text-slate-500">{{ post.width }}x{{ post.height }}px</p>
          </div>
          <a href="{{ post.url }}" target="_blank" download="dr-labi-{{ post.label|slugify }}.png" class="inline-flex h-9 items-center justify-center gap-2 rounded-md bg-emerald-600 px-3 text-sm font-medium text-white hover:bg-emerald-700">
            <i class="ph ph-download-simple"></i>
            Shkarko
          </a>
        </div>
        <img
          src="{{ post.url }}"
          alt="{{ post.label }}"
          class="mx-auto w-full rounded-md border border-slate-200 bg-white object-contain"
          style="aspect-ratio: {{ post.width }} / {{ post.height }}; max-width: {% if post.height > post.width %}420px{% else %}620px{% endif %};"
        >
      </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
