<section x-show="active==='recetat'" x-cloak x-data="RecetaTab({listUrl:'{% url 'prescription_list_json' patient.id %}',saveUrl:'{% url 'prescription_save' patient.id %}',printTpl:'{% url 'prescription_print' 0 %}'})">
  {% if not embedded %}<header class="module-heading"><div><h2>Recetat</h2><p>Përshkrimi i terapisë dhe historiku i recetave.</p></div><span class="pill pill-neutral" x-text="items.length + ' receta'"></span></header>{% endif %}
  <div class="module-success" x-show="savedId" x-cloak role="status">Receta u ruajt.</div>
  <div class="prescription-layout">
    <form class="module-card module-form" @submit.prevent="save">{% csrf_token %}
      <header class="module-card-head"><h3>Recetë e re</h3><i class="ph ph-prescription" aria-hidden="true"></i></header>
      <section class="form-section"><div class="field-grid">
        <label class="field full">Diagnoza<textarea x-model="form.diagnosis" rows="2" required placeholder="Diagnoza e pacientit"></textarea></label>
        <label class="field full">Terapia<textarea x-model="form.therapy" rows="4" required placeholder="Medikamenti, doza dhe kohëzgjatja"></textarea></label>
        <fieldset class="full"><legend class="module-caption">Alergji të deklaruara</legend><div class="choice-row"><label><input type="radio" name="rx_allergy" value="no" x-model="uiAllergy"> Jo</label><label><input type="radio" name="rx_allergy" value="yes" x-model="uiAllergy"> Po</label></div></fieldset>
        <label class="field full" x-show="uiAllergy==='yes'" x-cloak>Detajet e alergjisë<textarea x-model="form.allergy_notes" rows="2" placeholder="Alergjitë e deklaruara nga pacienti"></textarea></label>
        <label class="field full">Doktori<select x-model="form.doctor" required><option value="">Zgjidh doktorin</option><option>Dr. Labi</option><option>Dr. Linda</option><option>HD.Geka</option></select></label>
      </div><p class="module-error" x-show="errors.length" x-cloak role="alert" x-text="errors.join(' ')"></p></section>
      <footer class="form-footer"><button class="btn" type="button" @click="resetForm" :disabled="saving">Pastro</button><button class="btn btn-primary" type="submit" :disabled="saving"><i class="ph ph-check" aria-hidden="true"></i><span x-text="saving ? 'Duke ruajtur…' : 'Ruaj recetën'"></span></button></footer>
    </form>
    <div><header class="module-heading"><h2>Historiku i recetave</h2></header><p class="module-caption" x-show="loading" role="status">Duke ngarkuar recetat…</p><div class="module-error" x-show="loadError" x-cloak role="alert"><span x-text="loadError"></span> <button type="button" class="btn btn-subtle" @click="load">Provo përsëri</button></div><div class="prescription-list">
      <template x-for="p in items" :key="p.id"><article class="module-card prescription-item"><div class="agreement-top"><span class="eyebrow" x-text="'RECETA #' + p.id"></span><span class="module-caption" x-text="p.prescription_date"></span></div><h3 x-text="p.diagnosis_short"></h3><span class="status-chip pending" x-show="p.has_allergy_notes">Alergji të shënuara</span><footer><span x-text="p.doctor"></span><a class="btn btn-subtle" :href="urlPrint(p.id)" target="_blank" rel="noopener"><i class="ph ph-printer" aria-hidden="true"></i> Printo</a></footer></article></template>
      <div class="module-card empty-state" x-show="loaded && !items.length && !loading && !loadError" x-cloak><i class="ph ph-prescription" aria-hidden="true"></i><p>Nuk ka receta të regjistruara.</p></div>
    </div></div>
  </div>
</section>
<script>
function RecetaTab({listUrl,saveUrl,printTpl}) {
  return {
    items:[],errors:[],loading:false,loaded:false,loadError:'',saving:false,savedId:null,
    form:{diagnosis:'',therapy:'',doctor:'',allergy_notes:''},uiAllergy:'no',
    init(){
      if(this.active==='recetat') this.load();
      this.$watch('active', value => { if(value==='recetat' && !this.loaded && !this.loading) this.load(); });
      this.$watch('uiAllergy', value => { if(value!=='yes') this.form.allergy_notes=''; });
    },
    urlPrint(id){return printTpl.replace('/0/',`/${id}/`);},
    async load(){
      if(this.loading) return;
      this.loading=true;this.loadError='';
      try { const response=await fetch(listUrl,{headers:{Accept:'application/json'}}); if(!response.ok) throw new Error();const data=await response.json();this.items=Array.isArray(data.results)?data.results:[];this.loaded=true; }
      catch {this.loadError='Recetat nuk u ngarkuan.';}
      finally {this.loading=false;}
    },
    resetForm(){this.form={diagnosis:'',therapy:'',doctor:'',allergy_notes:''};this.uiAllergy='no';this.errors=[];},
    async save(){
      if(this.saving) return;
      this.errors=[];
      if(!this.form.diagnosis.trim() || !this.form.therapy.trim() || !this.form.doctor){this.errors=['Plotësoni diagnozën, terapinë dhe doktorin.'];return;}
      this.saving=true;
      try {
        const response=await fetch(saveUrl,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':this.$root.querySelector('[name=csrfmiddlewaretoken]').value},body:JSON.stringify(this.form)});
        const data=await response.json();
        if(!response.ok || !data.ok){this.errors=[data.errors?Object.values(data.errors).join(' '):'Receta nuk u ruajt.'];return;}
        this.savedId=data.id;this.resetForm();await this.load();
      } catch {this.errors=['Lidhja dështoi. Kontrolloni historikun përpara se ta provoni përsëri.'];}
      finally {this.saving=false;}
    }
  };
}
</script>
